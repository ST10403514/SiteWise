<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - SiteWise</title>

  <!-- Favicons & PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="shortcut icon" href="/assets/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#233154">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SiteWise">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">

<div class="auth-top">
  <a href="/">SiteWise<small>Job cards for trade businesses</small></a>
</div>

<main class="auth-shell">
  <div class="auth-card">
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to pick up where you left off.</p>

    <div class="auth-tabs" role="tablist" aria-label="Sign in or create account">
      <button id="tabLogin" role="tab" aria-selected="true">Sign in</button>
      <button id="tabSignup" role="tab" aria-selected="false">Create account</button>
    </div>

    <div class="form-error" id="formError" role="alert"></div>

    <form class="auth-form" id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" placeholder="e.g. Sipho Dlamini" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.co.za" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required />
        <p class="forgot-row" id="forgotRow" style="margin:8px 0 0;text-align:right;font-size:13px;">
          <a href="/forgot-password" style="color:#2563eb;text-decoration:none;">Forgot password?</a>
        </p>
      </div>
      <div class="field field-check" id="termsField" hidden>
        <label class="check">
          <input type="checkbox" id="acceptTerms" name="acceptTerms" />
          <span>I agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms &amp; Conditions and Privacy Policy</a></span>
        </label>
      </div>
      <button class="btn btn-primary" id="submitBtn" type="submit">Sign in</button>
    </form>

    <p class="auth-foot">Sessions are kept in a secure cookie on this device.</p>
  </div>
</main>

<script src="/js/services/ApiClient.js"></script>
<script src="/js/services/SessionGuard.js"></script>
<script src="/js/pages/auth.js" defer></script>
<script src="/js/pwa.js" defer></script>
<script>
  // "Forgot password?" only makes sense on the Sign in tab, not Create account.
  (function () {
    var forgot = document.getElementById('forgotRow');
    var tabLogin = document.getElementById('tabLogin');
    var tabSignup = document.getElementById('tabSignup');
    if (!forgot || !tabLogin || !tabSignup) return;
    tabLogin.addEventListener('click', function () { forgot.hidden = false; });
    tabSignup.addEventListener('click', function () { forgot.hidden = true; });
  })();
</script>
</body>
</html>
