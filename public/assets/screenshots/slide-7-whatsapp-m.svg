<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" font-family="Barlow, Arial, sans-serif">
  <rect width="390" height="800" fill="#f4f6fa"/>
  <rect width="390" height="66" fill="#233154"/>
  <rect y="66" width="390" height="3" fill="#2563eb"/>
  <rect x="14" y="13" width="40" height="40" rx="8" fill="#ffffff" opacity="0.14"/>
  <text x="34" y="40" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">A</text>
  <text x="64" y="31" font-size="15" fill="#ffffff" font-weight="bold">Atlas Painting Co.</text>
  <text x="64" y="47" font-size="9.5" fill="#b4c3dc">Send it on WhatsApp</text>

  <text x="14" y="98" font-size="15" fill="#233154" font-weight="bold" letter-spacing="0.8">SEND IT ON WHATSAPP</text>
  <text x="14" y="116" font-size="10.5" fill="#64748b">One tap opens WhatsApp with the message</text>
  <text x="14" y="130" font-size="10.5" fill="#64748b">already written, quote number, total and all.</text>

  <!-- action bar button -->
  <rect x="12" y="144" width="366" height="44" rx="9" fill="#25d366"/>
  <circle cx="42" cy="166" r="12" fill="#ffffff"/>
  <path d="M42 158 a7.5 7.5 0 0 0 -6.5 11 l-1 3.5 3.5 -1 a7.5 7.5 0 1 0 4 -13.5 z" fill="#25d366"/>
  <text x="62" y="171" font-size="13.5" fill="#ffffff" font-weight="bold">Send to client on WhatsApp</text>

  <g font-size="11" fill="#334155">
    <circle cx="20" cy="212" r="3.5" fill="#25d366"/><text x="32" y="216">Message pre-filled from the job</text>
    <circle cx="20" cy="236" r="3.5" fill="#25d366"/><text x="32" y="240">Works with 082, +27, any SA format</text>
    <circle cx="20" cy="260" r="3.5" fill="#25d366"/><text x="32" y="264">Client gets it before you leave</text>
  </g>

  <!-- phone -->
  <rect x="70" y="286" width="250" height="490" rx="26" fill="#0f172a"/>
  <rect x="80" y="296" width="230" height="470" rx="18" fill="#e5ddd5"/>
  <rect x="80" y="296" width="230" height="50" rx="18" fill="#1f6f5c"/>
  <rect x="80" y="326" width="230" height="20" fill="#1f6f5c"/>
  <circle cx="106" cy="320" r="13" fill="#ffffff" opacity="0.25"/>
  <text x="106" y="325" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">JN</text>
  <text x="126" y="316" font-size="12" fill="#ffffff" font-weight="bold">J. Naidoo</text>
  <text x="126" y="331" font-size="8.5" fill="#c8e6dd">online</text>
  <rect x="98" y="362" width="196" height="184" rx="11" fill="#dcf8c6"/>
  <g font-size="9.5" fill="#1e293b">
    <text x="110" y="384" font-weight="bold">Hi J. Naidoo,</text>
    <text x="110" y="402">Thanks for having us out today.</text>
    <text x="110" y="417">Your report and quotation from</text>
    <text x="110" y="432">Atlas Painting Co. is ready:</text>
    <text x="110" y="456" font-weight="bold">Quote APC-260720-412</text>
    <text x="110" y="473" font-weight="bold">Total: R 48 875.00 incl. VAT</text>
    <text x="110" y="496" fill="#475569" font-style="italic">Valid for 30 days.</text>
    <text x="110" y="516">Any questions, just shout.</text>
  </g>
  <text x="284" y="536" text-anchor="end" font-size="8" fill="#7c9885">14:32 &#10003;&#10003;</text>
  <rect x="92" y="726" width="176" height="30" rx="15" fill="#ffffff"/>
  <text x="106" y="746" font-size="9.5" fill="#94a3b8">Message</text>
  <circle cx="292" cy="741" r="14" fill="#1f6f5c"/>
  <path d="M286 741 L298 735 L292 747 Z" fill="#ffffff"/>
</svg>
