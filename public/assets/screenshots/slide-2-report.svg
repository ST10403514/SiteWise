<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Barlow, Arial, sans-serif">
  <defs><clipPath id="win2"><rect x="40" y="30" width="1120" height="690" rx="14"/></clipPath></defs>
  <rect x="40" y="30" width="1120" height="690" rx="14" fill="#ffffff" stroke="#dbe2ee"/>
  <g clip-path="url(#win2)">
    <rect x="40" y="30" width="1120" height="44" fill="#eef2f8"/>
    <circle cx="72" cy="52" r="6" fill="#f87171"/><circle cx="94" cy="52" r="6" fill="#fbbf24"/><circle cx="116" cy="52" r="6" fill="#34d399"/>
    <rect x="40" y="74" width="1120" height="14" fill="#233154"/>
    <rect x="80" y="112" width="1040" height="470" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="104" y="136" width="5" height="20" rx="2" fill="#2563eb"/>
    <text x="120" y="152" font-size="16" fill="#233154" font-weight="bold" letter-spacing="1.5">INSPECTION REPORT</text>
    <text x="106" y="184" font-size="12" fill="#64748b">PROBLEM REPORTED BY CLIENT</text>
    <rect x="104" y="192" width="992" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="118" y="216" font-size="14" fill="#1e293b">Client reports flaking paint and damp patches on the seaward wall</text>
    <text x="118" y="236" font-size="14" fill="#1e293b">after winter rains. Concerned about mould in the main bedroom.</text>
    <text x="106" y="288" font-size="12" fill="#64748b">INSPECTION FINDINGS</text>
    <rect x="104" y="296" width="992" height="82" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="118" y="320" font-size="14" fill="#1e293b">Hairline cracking along the parapet with failed waterproofing at two</text>
    <text x="118" y="340" font-size="14" fill="#1e293b">junctions. Moisture readings of 22–28% on the seaward wall. Previous</text>
    <text x="118" y="360" font-size="14" fill="#1e293b">coating applied over unprimed patches - poor adhesion throughout.</text>
    <text x="106" y="410" font-size="12" fill="#64748b">CONCLUSION &amp; RECOMMENDATION</text>
    <rect x="104" y="418" width="992" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="118" y="442" font-size="14" fill="#1e293b">Strip and re-waterproof the parapet, treat damp areas, then full</text>
    <text x="118" y="462" font-size="14" fill="#1e293b">exterior repaint: high-pressure clean, crack repair, primer, two coats.</text>
    <text x="106" y="512" font-size="12" fill="#64748b">OUTCOME</text>
    <g font-size="15">
      <rect x="104" y="522" width="310" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="122" y="550" fill="#64748b">Pass - no further action</text>
      <rect x="430" y="522" width="310" height="46" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
      <text x="448" y="550" fill="#d97706" font-weight="bold">Further work required</text>
      <rect x="756" y="522" width="310" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="774" y="550" fill="#64748b">Monitor - review in 30 days</text>
    </g>
    <rect x="40" y="640" width="1120" height="80" fill="#1a2540"/>
    <rect x="40" y="640" width="1120" height="3" fill="#2563eb"/>
    <text x="80" y="672" font-size="11" fill="#a0afc8" letter-spacing="1">TOTAL DUE (INCL. VAT)</text>
    <text x="80" y="700" font-size="26" fill="#ffffff" font-weight="bold">R 48 875.00</text>
    <rect x="742" y="662" width="128" height="40" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="806" y="687" text-anchor="middle" font-size="14" fill="#ffffff">Report PDF</text>
    <rect x="882" y="662" width="118" height="40" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="941" y="687" text-anchor="middle" font-size="14" fill="#ffffff">Quote PDF</text>
    <rect x="1012" y="662" width="108" height="40" rx="8" fill="#2563eb"/>
    <text x="1066" y="687" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">Full PDF</text>
  </g>
</svg>
