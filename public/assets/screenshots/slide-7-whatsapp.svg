<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Barlow, Arial, sans-serif">
  <defs><clipPath id="win7"><rect x="40" y="30" width="1120" height="690" rx="14"/></clipPath></defs>
  <rect x="40" y="30" width="1120" height="690" rx="14" fill="#ffffff" stroke="#dbe2ee"/>
  <g clip-path="url(#win7)">
    <rect x="40" y="30" width="1120" height="44" fill="#eef2f8"/>
    <circle cx="72" cy="52" r="6" fill="#f87171"/><circle cx="94" cy="52" r="6" fill="#fbbf24"/><circle cx="116" cy="52" r="6" fill="#34d399"/>
    <rect x="440" y="41" width="320" height="22" rx="11" fill="#ffffff" stroke="#dbe2ee"/>
    <text x="600" y="57" text-anchor="middle" font-size="13" fill="#94a3b8">app.sitewise.co.za/job</text>
    <rect x="40" y="74" width="1120" height="14" fill="#233154"/>

    <!-- left: explanation + action bar -->
    <text x="80" y="132" font-size="22" fill="#233154" font-weight="bold" letter-spacing="1">SEND IT ON WHATSAPP</text>
    <text x="80" y="158" font-size="14" fill="#64748b">Finished the quote? One tap opens WhatsApp with a</text>
    <text x="80" y="180" font-size="14" fill="#64748b">message already written, quote number, total and all.</text>

    <!-- the action bar as it appears in the app -->
    <rect x="80" y="212" width="520" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="104" y="240" font-size="12" fill="#94a3b8" letter-spacing="1">ACTION BAR</text>
    <rect x="104" y="254" width="472" height="44" rx="8" fill="#25d366"/>
    <circle cx="132" cy="276" r="13" fill="#ffffff"/>
    <path d="M132 268 a8 8 0 0 0 -7 12 l-1 4 4 -1 a8 8 0 1 0 4 -15 z" fill="#25d366"/>
    <text x="152" y="282" font-size="14.5" fill="#ffffff" font-weight="bold">Send to client on WhatsApp</text>
    <rect x="104" y="308" width="150" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="179" y="332" text-anchor="middle" font-size="13" fill="#475569">Report PDF</text>
    <rect x="264" y="308" width="150" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="339" y="332" text-anchor="middle" font-size="13" fill="#475569">Quote PDF</text>
    <rect x="424" y="308" width="152" height="38" rx="8" fill="#2563eb"/>
    <text x="500" y="332" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Full report</text>

    <!-- bullet points -->
    <g font-size="14" fill="#334155">
      <circle cx="90" cy="410" r="4" fill="#25d366"/><text x="104" y="415">Message pre-filled from the job, no typing</text>
      <circle cx="90" cy="444" r="4" fill="#25d366"/><text x="104" y="449">Works with SA numbers - 082, +27, all formats</text>
      <circle cx="90" cy="478" r="4" fill="#25d366"/><text x="104" y="483">Client gets it before you've left the driveway</text>
    </g>

    <!-- right: phone with whatsapp chat -->
    <rect x="700" y="112" width="384" height="548" rx="30" fill="#0f172a"/>
    <rect x="712" y="124" width="360" height="524" rx="20" fill="#e5ddd5"/>
    <!-- whatsapp header -->
    <rect x="712" y="124" width="360" height="62" rx="20" fill="#1f6f5c"/>
    <rect x="712" y="160" width="360" height="26" fill="#1f6f5c"/>
    <path d="M732 155 l-10 -10 l10 -10" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="762" cy="155" r="17" fill="#ffffff" opacity="0.25"/>
    <text x="762" y="161" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">JN</text>
    <text x="790" y="150" font-size="15" fill="#ffffff" font-weight="bold">J. Naidoo</text>
    <text x="790" y="169" font-size="11" fill="#c8e6dd">online</text>
    <!-- message bubble -->
    <rect x="742" y="212" width="300" height="216" rx="14" fill="#dcf8c6"/>
    <path d="M1042 228 L1056 220 L1042 244 Z" fill="#dcf8c6"/>
    <g font-size="13" fill="#1e293b">
      <text x="760" y="242" font-weight="bold">Hi J. Naidoo,</text>
      <text x="760" y="266">Thanks for having us out today. Your</text>
      <text x="760" y="285">inspection report and quotation from</text>
      <text x="760" y="304">Atlas Painting Co. is ready:</text>
      <text x="760" y="334" font-weight="bold">Quote APC-260720-412</text>
      <text x="760" y="356" font-weight="bold">Total: R 48 875.00 incl. VAT</text>
      <text x="760" y="384" fill="#475569" font-style="italic">Valid for 30 days from today.</text>
      <text x="760" y="408">Any questions, just shout.</text>
    </g>
    <text x="1026" y="420" text-anchor="end" font-size="11" fill="#7c9885">14:32 &#10003;&#10003;</text>
    <!-- input bar -->
    <rect x="726" y="600" width="272" height="38" rx="19" fill="#ffffff"/>
    <text x="746" y="624" font-size="13" fill="#94a3b8">Message</text>
    <circle cx="1024" cy="619" r="19" fill="#1f6f5c"/>
    <path d="M1016 619 L1032 611 L1024 627 Z" fill="#ffffff"/>
  </g>
</svg>
