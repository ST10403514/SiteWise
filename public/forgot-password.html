<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password &middot; SiteWise</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .auth-wrap { max-width: 420px; margin: 8vh auto; padding: 0 20px; }
    .auth-card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:28px; }
    .auth-card h1 { margin:0 0 8px; font-size:20px; color:#1e293b; }
    .auth-card p.sub { margin:0 0 20px; color:#64748b; font-size:14px; line-height:1.5; }
    .auth-card label { display:block; font-size:13px; color:#334155; margin:0 0 6px; font-weight:600; }
    .auth-card input { width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:15px; }
    .auth-card button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:8px; background:#2563eb; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    .auth-card button:disabled { opacity:.6; cursor:default; }
    .auth-msg { margin-top:16px; font-size:14px; line-height:1.5; padding:12px; border-radius:8px; display:none; }
    .auth-msg.ok { background:#ecfdf5; color:#065f46; display:block; }
    .auth-msg.err { background:#fef2f2; color:#991b1b; display:block; }
    .auth-foot { margin-top:18px; text-align:center; font-size:13px; }
    .auth-foot a { color:#2563eb; text-decoration:none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="sub">Enter the email address on your account and we'll send you a link to reset your password.</p>
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      <button id="submit" type="button">Send reset link</button>
      <div id="msg" class="auth-msg"></div>
      <div class="auth-foot"><a href="/">Back to sign in</a></div>
    </div>
  </div>

  <script>
    (function () {
      var email = document.getElementById('email');
      var btn = document.getElementById('submit');
      var msg = document.getElementById('msg');

      function show(kind, text) {
        msg.className = 'auth-msg ' + kind;
        msg.textContent = text;
      }

      async function submit() {
        var value = (email.value || '').trim();
        if (!value) { show('err', 'Please enter your email address.'); return; }
        btn.disabled = true;
        show('', '');
        try {
          var res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: value }),
          });
          var data = await res.json().catch(function () { return {}; });
          if (res.ok) {
            show('ok', data.message || "If an account exists for that email, a reset link is on its way. Check your inbox.");
          } else {
            show('err', (data && data.error) || 'Something went wrong. Please try again.');
            btn.disabled = false;
          }
        } catch (e) {
          show('err', 'Network error. Please try again.');
          btn.disabled = false;
        }
      }

      btn.addEventListener('click', submit);
      email.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    })();
  </script>
</body>
</html>
