<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My jobs - SiteWise</title>

  <!-- Favicons & PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="shortcut icon" href="/assets/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#233154">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SiteWise">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <!-- Apply saved colour scheme before paint to avoid a default-scheme flash -->
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('sitewise_theme') || 'null');
        if (t) {
          var r = document.documentElement.style;
          for (var k in t) r.setProperty(k, t[k]);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/jobs.css">
</head>
<body>

<header class="app-band">
  <div class="wrap">
    <div class="app-logo" id="companyLogo">S</div>
    <div>
      <div class="app-title" id="companyName">SiteWise</div>
      <div class="app-sub" id="companyTagline">Your job cards</div>
    </div>
    <div class="app-meta">
      <a class="btn btn-primary" href="/app" id="newJob">+ New job card</a>
      <div class="acct" id="acct">
        <button class="acct-btn" id="acctBtn" aria-haspopup="true" aria-expanded="false">
          <span class="acct-avatar" id="acctAvatar">S</span>
          <span class="acct-name" id="acctName">Your business</span>
          <span class="acct-caret">&#9662;</span>
        </button>
        <div class="acct-menu" role="menu">
          <div class="acct-head">
            <div class="nm" id="acctHeadName">Your business</div>
            <div class="em" id="acctHeadEmail"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="jobs-head">
    <div class="sec-title"><h1>Job cards</h1></div>
    <span class="jobs-count" id="jobsCount"></span>
  </div>

  <input type="search" id="jobSearch" class="search-field" placeholder="Search by client, address or quote number&hellip;" />

  <div class="filter-block">
    <div class="filter-label">Filter by outcome</div>
    <div class="chips" id="outcomeFilters" role="group" aria-label="Filter by outcome"></div>
  </div>
  <div class="filter-block">
    <div class="filter-label">Filter by type</div>
    <div class="chips" id="jobTypeFilters" role="group" aria-label="Filter by type"></div>
  </div>

  <div id="jobList" class="job-list" aria-live="polite"></div>
  <p class="empty-hint" id="jobsFilterEmpty" hidden>No job cards match your search/filters.</p>
  <div class="jobs-empty" id="jobsEmpty" hidden>
    <p><strong>No job cards yet.</strong></p>
    <p>Start your first one - it saves automatically as you work,
       and you can come back to it any time.</p>
    <a class="btn btn-primary" href="/app">Start your first job card</a>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="/js/services/ErrorTracking.js"></script>
<script src="/js/config/IndustryPresets.js"></script>
<script src="/js/services/Theme.js"></script>
<script src="/js/services/ApiClient.js"></script>
<script src="/js/services/SessionGuard.js"></script>
<script src="/js/services/LocalStore.js"></script>
<script src="/js/services/JobStore.js"></script>
<script src="/js/models/Job.js"></script>
<script src="/js/services/AccountMenu.js"></script>
<script src="/js/pages/jobs.js" defer></script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
